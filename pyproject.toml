[project]
name = "claimlens"
version = "1.0.0"
description = "Healthcare claims analytics and payment integrity on CMS synthetic Medicare claims and real CMS benchmarks."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abdul Sohail" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["claimlens", "lib"]
