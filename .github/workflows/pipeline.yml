name: Claims pipeline

# Pulls every source from CMS and FDA, rebuilds the warehouse, runs the data tests,
# and publishes the marts the dashboard reads. Monthly, because CMS publishes on that cadence.
on:
  schedule:
    - cron: "23 7 3 * *"   # 07:23 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ingest CMS synthetic claims, CMS benchmarks and FDA NDC directory
        run: python -m claimlens.ingest

      - name: Snapshot raw parquet to the raw-snapshot branch
        run: |
          rm -rf /tmp/raw && mkdir -p /tmp/raw/data && cp -r data/raw /tmp/raw/data/
          cd /tmp/raw
          git init -q -b raw-snapshot
          git config user.name "Abdul Sohail"
          git config user.email "abdulsohail018@gmail.com"
          printf "Raw parquet snapshot written by the Claims pipeline workflow. Not edited by hand.\n" > README.md
          git add -A
          git commit -qm "raw snapshot $(date -u +%Y-%m-%d)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" raw-snapshot

      - name: Build warehouse, run data tests, export marts
        if: ${{ hashFiles('claimlens/warehouse.py') != '' }}
        run: python -m claimlens.warehouse --test --export

      - name: Regenerate insights report
        if: ${{ hashFiles('claimlens/insights.py') != '' }}
        run: python -m claimlens.insights

      - name: Commit marts
        run: |
          git config user.name "Abdul Sohail"
          git config user.email "abdulsohail018@gmail.com"
          git add data/marts
          if [ -f INSIGHTS.md ]; then git add INSIGHTS.md; fi
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "data: pipeline run $(date -u +%Y-%m-%d)"
            git push
          fi
